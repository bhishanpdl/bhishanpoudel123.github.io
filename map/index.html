<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Locations Map - Subfolders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }
        
        .content {
            padding: 40px;
        }
        
        ul {
            list-style: none;
            margin-top: 20px;
        }
        
        li {
            margin-bottom: 15px;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        
        a {
            display: block;
            padding: 18px 25px;
            background: #f8f9fa;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 1.1em;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        a:hover {
            background: white;
            border-color: #667eea;
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .header p {
                font-size: 1em;
            }
            
            .content {
                padding: 25px;
            }
            
            a {
                padding: 15px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>??? Interview Locations</h1>
            <p>Select a region to view interview locations</p>
        </div>
        
        <div class="content">
            <p style="color: #666; font-size: 1.1em; margin-bottom: 10px;">Look at the subfolders for the map:</p>
            <ul>
                <li><a href="https://bhishanpoudel123.github.io/map/job">?? job apply places</a></li>
                <li><a href="https://bhishanpoudel123.github.io/map/addr">?? addr</a></li>
                <li><a href="https://bhishanpoudel123.github.io/map/addr_oh">?? addr_oh</a></li>
                <li><a href="https://bhishanpoudel123.github.io/map/addr_tx">?? addr_tx</a></li>
                <li><a href="https://bhishanpoudel123.github.io/map/addr_ny">?? addr_ny</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
