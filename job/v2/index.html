<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Job Loss Recovery Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            line-height: 1.6;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }

        h2 {
            color: #2c3e50;
            margin-top: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        h3 {
            color: #2c3e50;
            margin-top: 0;
        }

        h4 {
            color: #2c3e50;
            margin: 15px 0 10px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin: 20px 0;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .job-type-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .job-type-btn {
            flex: 1;
            padding: 15px;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
        }

        .job-type-btn.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .job-type-btn:hover {
            background: #d5dbdb;
        }

        .job-type-btn.active:hover {
            background: #2980b9;
        }

        .job-section {
            display: none;
        }

        .job-section.active {
            display: block;
        }

        .old-salary { color: #e74c3c !important; font-weight: 600; }
        .new-salary { color: #27ae60 !important; font-weight: 600; }
        .contract-salary { color: #9b59b6 !important; font-weight: 600; }
        .difference-value { color: #3498db !important; font-weight: 600; }

        .holidays-btn {
            background-color: #9b59b6;
            width: auto;
            padding: 10px 15px;
            margin-bottom: 15px;
        }

        .holidays-btn:hover {
            background-color: #8e44ad;
        }

        .holidays-list {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #9b59b6;
            display: none;
        }

        .holidays-list.active {
            display: block;
        }

        .contract-duration {
            background: #f3e5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #9b59b6;
        }

        .benefits-comparison {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #3498db;
        }

        .income-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .income-table th {
            background: #3498db;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
        }

        .income-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .income-table tr:hover {
            background: #f8f9fa;
        }

        .income-table .year-header {
            background: #2c3e50;
            color: white;
            font-weight: bold;
        }

        .income-table .positive {
            color: #27ae60;
            font-weight: 600;
        }

        .income-table .negative {
            color: #e74c3c;
            font-weight: 600;
        }

        .income-table .total-row {
            background: #f8f9fa;
            font-weight: 600;
            border-top: 2px solid #3498db;
        }

        @media (max-width: 768px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .job-type-selector {
                flex-direction: column;
            }

            .income-table {
                font-size: 14px;
            }

            .income-table th,
            .income-table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Job Loss Recovery Calculator</h1>

        <div class="input-section">
            <h2>Job Transition Details</h2>
            <div class="input-grid">
                <div>
                    <label for="leave-date">Last Day at Previous Job (Last Paid Date):</label>
                    <input type="date" id="leave-date" value="2024-12-14">
                </div>

                <div>
                    <label for="join-date">First Day at New Job:</label>
                    <input type="date" id="join-date" value="2025-09-20">
                </div>

                <div>
                    <label for="last-salary">Previous Job Salary ($ per year):</label>
                    <input type="number" id="last-salary" value="111000" step="1000">
                </div>
            </div>

            <!-- Old Job Benefits Section -->
            <div class="benefits-comparison">
                <h3>🏢 Previous Job Benefits</h3>
                <div class="input-grid">
                    <div>
                        <label for="old-paid-days">Paid Days Off (Vacation/Sick):</label>
                        <input type="number" id="old-paid-days" value="20" step="1" min="0" max="365">
                    </div>
                    <div>
                        <label for="old-paid-holidays">Paid Federal Holidays:</label>
                        <input type="number" id="old-paid-holidays" value="11" step="1" min="0" max="20">
                    </div>
                    <div>
                        <label for="old-annual-increase">Annual Increase (%):</label>
                        <input type="number" id="old-annual-increase" value="3" step="0.1" min="0" max="20">
                    </div>
                </div>
            </div>

            <!-- New Job Type Selector -->
            <div class="job-type-selector">
                <div class="job-type-btn active" data-type="permanent">🏢 Permanent Job</div>
                <div class="job-type-btn" data-type="contract">📝 Contract Job</div>
            </div>

            <!-- Permanent Job Section -->
            <div class="job-section permanent-job active" id="permanent-job-section">
                <div class="input-grid">
                    <div>
                        <label for="new-salary">New Job Salary ($ per year):</label>
                        <input type="number" id="new-salary" value="140000" step="1000">
                    </div>

                    <div>
                        <label for="new-annual-increase">Annual Increase (%):</label>
                        <input type="number" id="new-annual-increase" value="3" step="0.1" min="0" max="20">
                    </div>
                </div>
            </div>

            <!-- Contract Job Section -->
            <div class="job-section contract-job" id="contract-job-section">
                <div class="contract-duration">
                    <h4>Contract Duration</h4>
                    <div class="input-grid">
                        <div>
                            <label for="contract-start-date">Contract Start Date:</label>
                            <input type="date" id="contract-start-date" value="2025-10-22">
                        </div>
                        <div>
                            <label for="contract-end-date">Contract End Date:</label>
                            <input type="date" id="contract-end-date" value="2025-12-31">
                        </div>
                    </div>
                </div>

                <div class="input-grid">
                    <div>
                        <label for="hourly-rate">Contract Hourly Rate ($):</label>
                        <input type="number" id="hourly-rate" value="67" step="1" min="0">
                    </div>

                    <div>
                        <label for="hours-per-week">Hours per Week:</label>
                        <input type="number" id="hours-per-week" value="40" step="1" min="1" max="80">
                    </div>
                </div>

                <div class="benefits-comparison">
                    <h4>Contract Job Benefits (Unpaid Days)</h4>
                    <div class="input-grid">
                        <div>
                            <label for="contract-unpaid-days">Unpaid Days (Vacation/Sick):</label>
                            <input type="number" id="contract-unpaid-days" value="20" step="1" min="0" max="365">
                        </div>
                        <div>
                            <label for="contract-unpaid-holidays">Unpaid Federal Holidays:</label>
                            <input type="number" id="contract-unpaid-holidays" value="11" step="1" min="0" max="20">
                        </div>
                    </div>
                </div>

                <button type="button" class="holidays-btn" id="show-holidays">Show Federal Holidays</button>
                
                <div class="holidays-list" id="holidays-list">
                    <h4>Federal Holidays (Unpaid Days)</h4>
                    <div id="holidays-dates"></div>
                </div>
            </div>

            <button id="calculate">Calculate Recovery Time</button>
            <div id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
